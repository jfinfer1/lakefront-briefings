<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',-apple-system,sans-serif;background:#fff;max-width:840px}
  .top-bar{background:#1e2251;padding:14px 32px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  .top-bar-left{text-align:left}
  .top-bar-left .release{font-size:11px;color:rgba(255,255,255,0.7);font-weight:400;margin-bottom:2px}
  .top-bar-left .date{font-size:15px;color:#fff;font-weight:600}
  .top-bar-center{text-align:center}
  .top-bar-center h1{font-size:28px;font-weight:900;color:#fff;letter-spacing:1px;text-transform:uppercase}
  .top-bar-right{text-align:right}
  .top-bar-right img{height:36px;width:auto;display:inline-block}
  .content{padding:24px 32px 8px}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
  .card{border-radius:10px;padding:14px 16px 12px}
  .card.butter{background:#d4860a}
  .card.cheddar{background:#3b7dd8}
  .card.ndm{background:#1ea362}
  .card-label{font-size:13px;font-weight:800;color:#000;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
  .card-value{font-size:28px;font-weight:800;color:#fff;line-height:1.1;letter-spacing:-0.5px;font-variant-numeric:tabular-nums}
  .card-change{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:600;margin-top:7px;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,0.2);color:#fff}
  .chart-wrap{position:relative;width:100%;height:360px}
  .bottom-bar{background:#1e2251;padding:11px 32px;display:flex;align-items:center;justify-content:space-between;margin-top:14px}
  .bottom-bar-left{font-size:11px;color:#fff;font-weight:700}
  .bottom-bar-right{font-size:11px;color:#fff;font-weight:700}
</style>
</head>
