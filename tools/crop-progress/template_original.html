<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:#dde0f0; }
.card { width:900px; margin:0 auto; background:#f8f6f1; box-shadow:0 12px 48px rgba(27,30,85,.22); }
.hd { background:#1a1e55; padding:14px 28px; display:flex; align-items:center; justify-content:center; position:relative; }
.hd-left { position:absolute; left:24px; top:50%; transform:translateY(-50%); }
.hd-date { font-family:'Playfair Display',serif; font-size:15px; font-weight:700; color:#fff; }
.hd-week { font-size:9px; color:#fff; letter-spacing:.5px; margin-top:1px; }
.hd h1 { font-family:'Playfair Display',serif; font-size:38px; font-weight:900; color:#fff; letter-spacing:1px; text-align:center; text-transform:uppercase; }
.hd .logo { position:absolute; right:20px; top:50%; transform:translateY(-50%); height:36px; mix-blend-mode:screen; }
.maps { padding:14px 20px 12px; display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
.map-box { background:#fff; border-radius:5px; padding:10px 10px 8px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.map-title { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:1.2px; color:#1a1e55; text-align:center; padding-bottom:4px; border-bottom:2px solid; margin-bottom:6px; }
.map-title.corn { border-color:#3a8c28; }
.map-title.soy { border-color:#c49520; }
.map-box svg { width:100%; height:auto; display:block; }
.map-key { display:flex; justify-content:center; align-items:center; gap:3px; margin-bottom:4px; }
.map-key .ks { width:14px; height:10px; border-radius:2px; border:1px solid rgba(0,0,0,.1); }
.map-key span { font-size:8px; color:#555; font-weight:600; margin-right:5px; }
.ge { border-top:3px solid #1a1e55; padding:8px 10px; margin-top:8px; }
.ge-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
.ge-name { font-size:10px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:#1a1e55; }
.ge-val { font-family:'Playfair Display',serif; font-size:20px; font-weight:900; color:#1e6b35; }
.ge-bar { display:flex; height:16px; border-radius:2px; overflow:hidden; margin-bottom:4px; }
.ge-sub { font-size:9px; color:#888; }
.ft { background:#1a1e55; padding:10px 20px; display:flex; justify-content:space-between; align-items:center; }
.ft span { font-size:12px; color:#fff; font-weight:500; }
</style>
</head>
