<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --navy: #242A68; --navy-dark: #1a1f4e; }

  #wrapper {
    width: 1200px; height: 675px;
    position: relative; overflow: hidden;
    background: #fff;
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    height: 80px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 30px;
    position: relative;
  }
  .header-date {
    position: absolute;
    left: 30px;
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .header-title { color: #fff; font-size: 36px; font-weight: 700; }
  .header-logo {
    position: absolute;
    right: 30px;
    height: 42px;
    opacity: 0.85;
  }

  .chart-container { padding: 14px 36px 0 36px; }

  .panel-title {
    font-size: 14px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--navy); margin-bottom: 10px;
    padding-bottom: 8px; border-bottom: 2.5px solid var(--navy);
  }

  svg.bars { width: 1128px; height: 510px; display: block; }

  .footer {
    position: absolute; bottom: 0; left: 0; right: 0; height: 32px;
    background: var(--navy);
    display: flex; align-items: center; justify-content: space-between; padding: 0 30px;
  }
  .footer-text { font-size: 11px; color: rgba(255,255,255,1.0); }
  .footer-brand { font-size: 11px; color: rgba(255,255,255,1.0); font-weight: 600; letter-spacing: 0.5px; }
</style>

  <div class="chart-container">
    <div class="panel-title">June 2026 &nbsp;&nbsp;|&nbsp;&nbsp; Month-over-Month &nbsp;&nbsp;|&nbsp;&nbsp; Billions USD</div>
    <svg class="bars" viewBox="0 0 1128 510" xmlns="http://www.w3.org/2000/svg">
      <script type="text/javascript"><![CDATA[
        var items = [
          { label: "Gold",                val: 3.4, emoji: "\uD83E\uDD47" },
          { label: "Natural\nGas",        val: 0.6, emoji: "\uD83D\uDCA8" },
          { label: "Corn",                val: 0.4, emoji: "\uD83C\uDF3D" },
          { label: "Copper",              val: 0.2, emoji: "\uD83E\uDE99" },
          { label: "Nat Gas\nLiquids",    val: -0.5, emoji: "\u26FD" },
          { label: "Soybeans",            val: -0.9, emoji: "\uD83E\uDED8" },
          { label: "Fuel\nOil",           val: -1.6, emoji: "\uD83D\uDD25" },
          { label: "Crude\nOil",          val: -5.7, emoji: "\uD83D\uDEE2\uFE0F" }
        ];

        var svg = document.querySelector('svg.bars');
        var padL = 70, padR = 30, padT = 10, padB = 80;
        var chartW = 1128 - padL - padR;
        var chartH = 510 - padT - padB;
        var n = items.length;
        var barGap = 18;
        var barW = (chartW - (n - 1) * barGap) / n;

        var maxVal = 4.0;
        var minVal = -7.0;
        var range = maxVal - minVal;

        function mapY(v) { return padT + ((maxVal - v) / range) * chartH; }

        var zeroY = mapY(0);

        // Horizontal grid lines
        var yTicks = [-6, -5, -4, -3, -2, -1, 0, 1, 2, 3];
        yTicks.forEach(function(t) {
          var y = mapY(t);
          var line = document.createElementNS("http://www.w3.org/2000/svg","line");
          line.setAttribute("x1", padL); line.setAttribute("x2", 1128 - padR);
          line.setAttribute("y1", y); line.setAttribute("y2", y);
          line.setAttribute("stroke", t === 0 ? "#444" : "#e8e9f0");
          line.setAttribute("stroke-width", t === 0 ? "1.5" : "0.8");
          svg.appendChild(line);

          var label = document.createElementNS("http://www.w3.org/2000/svg","text");
          label.setAttribute("x", padL - 12); label.setAttribute("y", y + 5);
          label.setAttribute("text-anchor","end"); label.setAttribute("fill","#777");
          label.setAttribute("font-size","13"); label.setAttribute("font-weight","600");
          label.setAttribute("font-family","-apple-system, sans-serif");
          label.textContent = (t >= 0 ? "+$" : "\u2212$") + Math.abs(t).toFixed(0) + "B";
          svg.appendChild(label);
        });

        items.forEach(function(item, i) {
          var x = padL + i * (barW + barGap);
          var isPos = item.val >= 0;
          var barH = Math.abs(item.val) / range * chartH;
          var barY = isPos ? zeroY - barH : zeroY;

          // Bar
          var rect = document.createElementNS("http://www.w3.org/2000/svg","rect");
          rect.setAttribute("x", x); rect.setAttribute("y", barY);
          rect.setAttribute("width", barW); rect.setAttribute("height", barH);
          rect.setAttribute("rx", "5");
          rect.setAttribute("fill", isPos ? "#242A68" : "#8b90b0");
          rect.setAttribute("opacity", isPos ? "0.9" : "0.65");
          svg.appendChild(rect);

          // Value above/below bar
          var valTxt = document.createElementNS("http://www.w3.org/2000/svg","text");
          valTxt.setAttribute("x", x + barW / 2);
          valTxt.setAttribute("y", isPos ? barY - 10 : barY + barH + 20);
          valTxt.setAttribute("text-anchor","middle");
          valTxt.setAttribute("fill", isPos ? "#242A68" : "#666");
          valTxt.setAttribute("font-size","17"); valTxt.setAttribute("font-weight","700");
          valTxt.setAttribute("font-family","-apple-system, sans-serif");
          valTxt.textContent = (isPos ? "+$" : "\u2212$") + Math.abs(item.val).toFixed(1) + "B";
          svg.appendChild(valTxt);

          // X-axis label (multi-line)
          var lines = item.label.split("\n");
          lines.forEach(function(ln, li) {
            var lbl = document.createElementNS("http://www.w3.org/2000/svg","text");
            lbl.setAttribute("x", x + barW / 2);
            lbl.setAttribute("y", 510 - padB + 20 + li * 18);
            lbl.setAttribute("text-anchor","middle"); lbl.setAttribute("fill","#444");
            lbl.setAttribute("font-size","14"); lbl.setAttribute("font-weight","600");
            lbl.setAttribute("font-family","-apple-system, sans-serif");
            lbl.textContent = ln;
            svg.appendChild(lbl);
          });

          // Emoji above label
          var emo = document.createElementNS("http://www.w3.org/2000/svg","text");
          emo.setAttribute("x", x + barW / 2);
          emo.setAttribute("y", 510 - padB + 4);
          emo.setAttribute("text-anchor","middle");
          emo.setAttribute("font-size","16");
          emo.textContent = item.emoji;
          svg.appendChild(emo);
        });
      ]]></script>
    </svg>
