const CW = 2400, CH = 1350;
const HEADER_H = 140;
const FOOTER_H = 70;
const PLOT_LEFT   = 200;
const PLOT_RIGHT  = 2200;
const PLOT_TOP    = 260;
const PLOT_BOTTOM = 1220;

const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");

// ── Monotone cubic interpolation (Fritsch-Carlson) ──────────
function monotoneCubic(xs, ys, numPts) {
  const n = xs.length;
  if (n < 2) return { x: xs, y: ys };

  const dx = [], dy = [], m = [];
  for (let i = 0; i < n - 1; i++) {
    dx.push(xs[i+1] - xs[i]);
    dy.push(ys[i+1] - ys[i]);
    m.push(dy[i] / dx[i]);
  }

  const c = [m[0]];
  for (let i = 1; i < n - 1; i++) {
    if (m[i-1] * m[i] <= 0) {
      c.push(0);
    } else {
      const common = dx[i-1] + dx[i];
      c.push(3 * common / ((common + dx[i]) / m[i-1] + (common + dx[i-1]) / m[i]));
    }
  }
  c.push(m[n-2]);

  const outX = [], outY = [];
  for (let i = 0; i < n - 1; i++) {
    const steps = Math.max(2, Math.round(numPts / (n - 1)));
    for (let j = 0; j < steps; j++) {
      const t = j / steps;
      const h00 = (1 + 2*t) * (1 - t) * (1 - t);
      const h10 = t * (1 - t) * (1 - t);
      const h01 = t * t * (3 - 2*t);
      const h11 = t * t * (t - 1);
      const x = xs[i] + t * dx[i];
      const y = h00 * ys[i] + h10 * dx[i] * c[i] + h01 * ys[i+1] + h11 * dx[i] * c[i+1];
      outX.push(x);
      outY.push(y);
    }
  }
  outX.push(xs[n-1]);
  outY.push(ys[n-1]);
  return { x: outX, y: outY };
}

// ── Coordinate mappers ──────────────────────────────────────
function mapX(idx) {
  const range = weeks.length - 1;
  return PLOT_LEFT + (idx / range) * (PLOT_RIGHT - PLOT_LEFT);
}
function mapY(val) {
  return PLOT_BOTTOM - ((val - Y_MIN) / (Y_MAX - Y_MIN)) * (PLOT_BOTTOM - PLOT_TOP);
}

// ── Draw ────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, CW, CH);

  // Background
  ctx.fillStyle = WHITE;
  ctx.fillRect(0, 0, CW, CH);

  // Navy header bar
  ctx.fillStyle = NAVY;
  ctx.fillRect(0, 0, CW, HEADER_H);

  // Navy footer bar
  ctx.fillStyle = NAVY;
  ctx.fillRect(0, CH - FOOTER_H, CW, FOOTER_H);

  // Title (centered in header area below navy bar)
  ctx.fillStyle = NAVY;
  ctx.font = "bold 48px 'Helvetica Neue', Helvetica, Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(TITLE, CW / 2, HEADER_H + 60);

  // Subtitle
  ctx.fillStyle = "#666666";
  ctx.font = "28px 'Helvetica Neue', Helvetica, Arial, sans-serif";
  ctx.fillText(SUBTITLE + " | " + REPORT_DATE, CW / 2, HEADER_H + 100);

  // Y-axis grid lines and labels
  ctx.strokeStyle = GRID_CLR;
  ctx.lineWidth = 1;
  ctx.font = "bold 22px 'Helvetica Neue', Helvetica, Arial, sans-serif";
  ctx.textAlign = "right";
  ctx.fillStyle = TXT_BOLD;
  for (let v = Y_MIN; v <= Y_MAX; v += Y_STEP) {
    const y = mapY(v);
    ctx.beginPath();
    ctx.moveTo(PLOT_LEFT, y);
    ctx.lineTo(PLOT_RIGHT, y);
    ctx.stroke();
    ctx.fillText(v.toLocaleString(), PLOT_LEFT - 16, y + 7);
  }

  // X-axis labels
  ctx.textAlign = "center";
  ctx.font = "bold 22px 'Helvetica Neue', Helvetica, Arial, sans-serif";
  ctx.fillStyle = TXT_BOLD;
  for (let i = 0; i < weeks.length; i++) {
    ctx.fillText(weeks[i], mapX(i), PLOT_BOTTOM + 40);
  }

  // Build index arrays for interpolation
  const xIdx = weeks.map((_, i) => i);

  // Smooth curves
  const smoothCurrent = monotoneCubic(xIdx, current, 200);
  const smoothLast    = monotoneCubic(xIdx, lastYear, 200);

  // Draw last year line (below current)
  ctx.strokeStyle = LASTYEAR_CLR;
  ctx.lineWidth = 4;
  ctx.beginPath();
  for (let i = 0; i < smoothLast.x.length; i++) {
    const px = mapX(smoothLast.x[i]);
    const py = mapY(smoothLast.y[i]);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();

  // Draw current year line (on top)
  ctx.strokeStyle = CURRENT_CLR;
  ctx.lineWidth = 6;
  ctx.beginPath();
  for (let i = 0; i < smoothCurrent.x.length; i++) {
    const px = mapX(smoothCurrent.x[i]);
    const py = mapY(smoothCurrent.y[i]);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();

  // Dot markers — last year
  ctx.fillStyle = LASTYEAR_CLR;
  for (let i = 0; i < weeks.length; i++) {
    ctx.beginPath();
    ctx.arc(mapX(i), mapY(lastYear[i]), 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = WHITE; ctx.lineWidth = 1; ctx.stroke();
  }

  // Dot markers — current year
  ctx.fillStyle = CURRENT_CLR;
  for (let i = 0; i < weeks.length; i++) {
    ctx.beginPath();
    ctx.arc(mapX(i), mapY(current[i]), 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = WHITE; ctx.lineWidth = 1; ctx.stroke();
  }

  // Last value annotation (right next to the last point, slightly below, no arrow)
  const lastVal = current[current.length - 1];
  const lx = mapX(weeks.length - 1) + 30;
  const yRange = Y_MAX - Y_MIN;
  const ly = mapY(lastVal) + (yRange * 0.04 / (Y_MAX - Y_MIN)) * (PLOT_BOTTOM - PLOT_TOP);

  ctx.font = "bold 24px 'Helvetica Neue', Helvetica, Arial, sans-serif";
  ctx.textAlign = "left";
  ctx.fillStyle = CURRENT_CLR;

  // Background box for annotation
  const txt = lastVal.toLocaleString();
  const tw = ctx.measureText(txt).width;
  const pad = 10;
  ctx.fillStyle = "#e8eef8";
  ctx.strokeStyle = CURRENT_CLR;
  ctx.lineWidth = 2;
  const boxX = lx - pad;
  const boxY = ly - 18;
  const boxW = tw + pad * 2;
  const boxH = 30;
  ctx.beginPath();
  ctx.roundRect(boxX, boxY, boxW, boxH, 6);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = CURRENT_CLR;
  ctx.fillText(txt, lx, ly + 6);

  // Legend
  const legY = HEADER_H + 98;
  const legX = CW / 2 - 160;

  // Current year legend
  ctx.strokeStyle = CURRENT_CLR;
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(legX, legY);
  ctx.lineTo(legX + 40, legY);
  ctx.stroke();
  ctx.fillStyle = TXT_BOLD;
  ctx.font = "24px 'Helvetica Neue', Helvetica, Arial, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("2026", legX + 50, legY + 7);

  // Last year legend
  const leg2X = legX + 160;
  ctx.strokeStyle = LASTYEAR_CLR;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(leg2X, legY);
  ctx.lineTo(leg2X + 40, legY);
  ctx.stroke();
  ctx.fillStyle = TXT_BOLD;
  ctx.fillText("2025", leg2X + 50, legY + 7);

  // Footer text
  ctx.fillStyle = WHITE;
  ctx.font = "bold 20px 'Helvetica Neue', Helvetica, Arial, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Source: USDA  |  lakefrontfutures.com/briefing/", CW / 2, CH - FOOTER_H / 2 + 7);

  // Logo in header
  const logo = new Image();
  logo.onload = function() {
    const logoH = HEADER_H * 0.65;
    const logoW = logoH * (logo.naturalWidth / logo.naturalHeight);
    ctx.drawImage(logo, 24, (HEADER_H - logoH) / 2, logoW, logoH);
  };
  logo.src = LOGO_SRC;
}

draw();
</script>
